[project]
name = "taskgate"
version = "0.1.0"
description = "Automated calibration and QA gate for human-authored RL/SFT tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
    "docker>=7.1",
    "pyyaml>=6.0",
]

[project.scripts]
taskgate = "taskgate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskgate"]

[tool.hatch.build.targets.wheel.force-include]
"taskgate/report/templates" = "taskgate/report/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "docker: needs a reachable Docker daemon; skipped automatically when none is available",
]
